name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Install dependencies
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      
      - name: Build App
        run: ./scripts/buildprod.sh

      - name: Auth with gcloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
    
      - name: Set-up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 363.0.0'
      
      - name: Get gcloud info
        run: gcloud info
    
      - name: Build & push to Artifact Registry
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-509507/notely-ar-repo/notely:latest .

      - name: Database migration
        run: ./scripts/migrateup.sh

      - name: Deploy service
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-509507/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-509507 --max-instances=4